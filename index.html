  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Segoe UI",Arial,sans-serif}button,select,input{font:inherit}button,select,input,summary{outline-offset:3px}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #28705C90}button{cursor:pointer}button:disabled{cursor:not-allowed}.site-header{min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:30px;padding:0 32px;background:radial-gradient(circle at 82% 150%,transparent 0 90px,#8E9FCB35 91px 92px,transparent 93px 125px,#8E9FCB35 126px 127px,transparent 128px),var(--mist);border-bottom:1px solid #B6DFE5}.brand{font-weight:750;font-size:19px;line-height:1.2;max-width:490px;letter-spacing:-.025em}.nav{display:flex;align-items:center;gap:32px;white-space:nowrap}.nav a{color:var(--ink);text-decoration:none;padding:24px 2px 20px;border-bottom:4px solid transparent}.nav a.active{border-color:var(--cyan);font-weight:700}.nav small{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:calc(100vh - 72px)}.sidebar{border-right:1px solid var(--line);padding:27px 25px 35px 30px}.sidebar h2{font-size:14px;margin:0 0 17px}.step-nav{list-style:none;padding:0;margin:0 0 32px}.step-nav li{margin:0 0 5px}.step-nav button{width:100%;background:none;border:0;text-align:left;padding:12px 14px;color:var(--muted);border-right:5px solid transparent}.step-nav button.active{background:var(--mist);color:var(--ink);border-color:var(--cyan)}.step-nav button:disabled{opacity:.44}.step-nav strong{display:block;font-size:14px}.step-nav span{display:block;font-size:12px;margin:3px 0 0 19px}.dot{display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;background:var(--mint)}.step-nav li:nth-child(2) .dot{background:var(--blue)}.step-nav li:nth-child(3) .dot{background:var(--pink)}.sidebar-section{border-top:1px solid var(--line);padding-top:23px;margin-top:24px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:15px 8px}.stats b{display:block;font-size:23px;line-height:1.15}.stats span{color:var(--muted);font-size:12px}.sidebar-note{font-size:12px;color:var(--muted);line-height:1.5}.main{min-width:0}.hero{padding:38px clamp(26px,5vw,70px) 30px;border-bottom:1px solid var(--line);background:radial-gradient(circle at 86% 140%,transparent 0 100px,#CCF0F580 101px 102px,transparent 103px 142px,#CCF0F580 143px 144px,transparent 145px),var(--paper)}h1{font-size:clamp(28px,3vw,39px);line-height:1.16;letter-spacing:-.035em;margin:0 0 12px;max-width:750px}h1+p{margin:0;max-width:760px;color:var(--muted)}.panel{padding:28px clamp(26px,5vw,70px) 65px;max-width:1180px}.panel h2{font-size:23px;margin:0 0 10px;letter-spacing:-.02em}.panel h3{font-size:16px;margin:0 0 13px}.panel .lead{color:var(--muted);max-width:730px;margin:0 0 25px}.rule{border-top:1px solid var(--line);margin:26px 0}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(200px,1fr));gap:23px 25px;max-width:780px}.field label{display:block;font-weight:650;font-size:13px;margin-bottom:7px}.field select,.filters select,.filters input{width:100%;border:1px solid #CBCFD2;border-radius:0;background:white;color:var(--ink);padding:10px 12px;min-height:43px}.context-help{color:var(--muted);font-size:12px;margin:7px 0 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}.primary,.secondary{padding:10px 17px;border:1px solid var(--ink);font-weight:650}.primary{background:var(--ink);color:white}.primary:hover{background:#39594F}.secondary{background:#fff;color:var(--ink)}.secondary:hover{background:var(--wash)}.selected{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 25px}.selected span{background:var(--mist);padding:5px 10px;font-size:12px}.results{margin-top:29px;border-top:1px solid var(--ink)}.results-header{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:17px 0 11px}.results-header h3{margin:0;font-size:18px}.results-header small{color:var(--muted)}.result{display:grid;grid-template-columns:38px minmax(190px,.8fr) minmax(150px,.5fr) minmax(170px,.8fr);gap:12px;border-top:1px solid var(--line);padding:17px 0;align-items:start}.rank{color:#90979B;font-size:24px;line-height:1}.result button{padding:0;border:0;background:none;text-align:left;color:var(--ink);font-weight:650}.result button:hover{text-decoration:underline}.result .count{font-size:12px;color:#356657}.result details{font-size:12px;color:var(--muted)}.result summary{cursor:pointer}.excerpt{margin-top:10px;background:var(--wash);border-left:3px solid var(--cyan);padding:10px;max-height:230px;overflow:auto}.excerpt p{margin:0 0 10px}.excerpt p:last-child{margin:0}.empty{padding:28px 0;color:var(--muted)}.disclosure{max-width:780px;border-top:1px solid var(--line);margin-top:24px;padding-top:15px}.disclosure summary{cursor:pointer;font-size:13px}.filters{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:14px;margin-top:15px}.filters label{font-size:12px}.filters select,.filters input{margin-top:5px}.note{background:var(--warn);border-left:3px solid #E4C394;padding:12px 15px;font-size:12px;color:#665335;margin-top:21px;max-width:800px}.corpus-main,.method-main{padding:33px clamp(26px,5vw,70px) 70px;max-width:1300px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:25px 0}.summary-grid div{background:#fff;padding:16px}.summary-grid b{display:block;font-size:26px}.summary-grid span{font-size:12px;color:var(--muted)}.corpus-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}.profile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px;margin:25px 0}.profile h3{margin:0 0 10px}.bar-row{display:grid;grid-template-columns:minmax(150px,1fr) 2fr 38px;gap:10px;align-items:center;margin:8px 0;font-size:12px}.bar{height:6px;background:#EBEEF6}.bar i{display:block;height:100%;background:var(--cyan)}.table-wrap{overflow-x:auto;border-top:1px solid var(--ink)}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.01em}th,td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}td small{display:block;color:var(--muted);margin-top:3px}.method-main section{max-width:900px;border-top:1px solid var(--line);padding:24px 0}.method-main section:first-of-type{margin-top:26px}.method-main p,.method-main li{color:#4D5358}.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}.chain span{background:var(--mist);padding:10px 12px;font-weight:650;font-size:13px}.chain b{color:var(--cyan)}.method-main table{max-width:780px}.footer{border-top:1px solid var(--line);padding:20px clamp(26px,5vw,70px);color:var(--muted);font-size:12px}body[data-page="corpus"] .layout,body[data-page="method"] .layout{display:block}body[data-page="corpus"] .sidebar,body[data-page="method"] .sidebar{display:none}
    @media(max-width:950px){.layout{grid-template-columns:235px minmax(0,1fr)}.sidebar{padding:24px 17px}.result{grid-template-columns:34px minmax(140px,1fr) 130px}.result details{grid-column:2/-1}.profile{grid-template-columns:1fr}}
    @media(max-width:700px){.site-header{padding:12px 18px;align-items:flex-start}.brand{font-size:15px}.nav{gap:12px}.nav a{padding:3px 0 7px;font-size:12px}.nav small{display:none}.layout{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.step-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}.step-nav button{padding:8px 5px}.step-nav span{display:none}.sidebar-section{display:none}.hero{padding:28px 20px 22px}.panel,.corpus-main,.method-main{padding:24px 20px 45px}.field-grid,.filters{grid-template-columns:1fr}.result{grid-template-columns:30px 1fr}.result .count,.result details{grid-column:2}.summary-grid{grid-template-columns:repeat(2,1fr)}.profile{display:block}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<body>
  <header class="site-header"><div class="brand">Evidence-Based Evaluation Operationalization<br>Recommender</div><nav class="nav" aria-label="Primary"><a href="#recommender" data-route="recommender">Recommender</a><a href="#corpus" data-route="corpus">Corpus</a><a href="#method" data-route="method">Method</a><small>EN</small></nav></header>
  <div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main" id="app"></main></div>
  <script src="review_20261113.js?v=20261113c"></script>
  <script>
    const D=window.PERCEPTA_CURRENT;
    const G={G1:'Evaluation purpose',G2:'Design domain',G3:'Design stage',G4:'Evaluation object',G5:'Evaluators',G6:'Target users',G7:'AI function'};
    const E={
      L1:{A:'Design outcome quality',B:'Design process effectiveness',C:'Designer cognition, affect and capability',D:'Human–AI interaction experience',E:'Social and contextual value'},
      L2:{A1:'Novelty',A2:'Aesthetic quality',A3:'Suitability',A4:'Feasibility',A5:'Fidelity',A6:'Comprehensiveness',A7:'Style intention',A8:'Diversity of solution set',B1:'Time efficiency',B2:'Workload',B3:'Iteration efficiency',B4:'Decision support',B5:'Process continuity',C1:'Inspiration',C2:'Knowledge acquisition',C3:'Self-efficacy',C4:'Engagement and immersion',C5:'Enjoyment',C6:'Reflection',C7:'Fixation and dependence',C8:'Capability extension',D1:'Ease of use',D2:'Intention to use',D3:'Sense of control',D4:'Explainability',D5:'Trust',D6:'Agency',D7:'Roles, labor and contribution fairness',D8:'Communication, coordination and shared understanding',E1:'End-user experience and acceptance',E2:'Fit to user needs and context',E3:'Fit to professional and organizational work',E4:'Cultural, social and public value',E5:'Ethics, fairness, bias and inclusion',E6:'Environmental sustainability',E7:'Commercial, brand and market value',E8:'Long-term use and responsibility'},
      L3:{M1:'Named standardized scale',M2:'Bespoke structured rating',M3:'Qualitative verbal elicitation',M4:'Non-scale structured questionnaire',M5:'Existing perceptual material'},
      G1:{P1:'Needs inquiry',P2:'System training',P3:'Iterative guidance',P4:'Summative evaluation'},
      G2:{D1:'Visual communication',D2:'Industrial and product',D3:'Fashion',D4:'Interior',D5:'Service',D6:'UI/UX'},
      G3:{S1:'Research',S2:'Ideation',S3:'Prototyping and testing',S4:'Implementation'},
      G4:{O1:'Design outcome or solution',O2:'AI-assisted system and workflow',O3:'Design participant or team',O4:'Human–AI collaboration setup'},
      G5:{V1:'Professional designer',V2:'Design outcome user',V3:'External expert',V4:'General public',V5:'Researcher or developer'},
      G6:{U1:'Professional design practitioner',U2:'Design learner or novice',U3:'Non-professional creator'},
      G7:{F1:'Need recognition',F2:'Knowledge retrieval',F3:'Solution generation',F4:'Prototype realization',F5:'Evaluation feedback',F6:'Iterative optimization'}};
    const state={stage:1,object:'',dimension:'',indicator:'',filters:{},corpus:{query:'',domain:'',stage:'',dimension:'',tool:'',status:''}};
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const parts=s=>String(s||'').split(';').filter(x=>x&&!['NR','NA','UNMAPPED','UNRESOLVED','COMPOSITE'].includes(x));
    const name=(group,code)=>E[group]?.[code]||D.labels[group]?.[code]||code;
    const field={G1:'G1_purpose',G2:'G2_domain',G3:'G3_stage',G4:'G4_object',G5:'G5_evaluator',G6:'G6_target_user',G7:'G7_ai_function'};
    const route=()=>['recommender','corpus','method'].includes(location.hash.slice(1))?location.hash.slice(1):'recommender';
    const match=(r,g,code)=>!code||parts(r[field[g]]).includes(code);
    const distinct=rows=>new Set(rows.map(r=>r.paper_id)).size;
    const option=(group,selected,all='Select')=>`<option value="">${all}</option>${Object.entries(E[group]).map(([k,v])=>`<option value="${k}" ${selected===k?'selected':''}>${k} ${esc(v)}</option>`).join('')}`;
    const examples=rows=>{const seen=new Set(),out=[];for(const r of rows){if(seen.has(r.paper_id))continue;seen.add(r.paper_id);out.push(r);if(out.length===3)break}return out.map(r=>`<p><strong>${esc(r.title)}</strong><br>${r.pdf_page?`p. ${esc(r.pdf_page)} · `:''}${esc(String(r.source_item||r.claim||'').slice(0,230))}${r.tool_raw?`<br>Tool reported: ${esc(String(r.tool_raw).slice(0,140))}`:''}</p>`).join('')};
    const counts=(rows,group,fn)=>Object.entries(E[group]).map(([code,label])=>{const subset=rows.filter(r=>parts(fn(r)).includes(code));return {code,label,rows:subset,papers:distinct(subset)}}).sort((a,b)=>b.papers-a.papers||b.rows.length-a.rows.length||a.code.localeCompare(b.code));
    function resultList(items,group,next){return `<section class="results"><div class="results-header"><h3>${group==='L1'?'Evaluation dimensions':group==='L2'?'Subjective indicators':'Tool classes'}</h3><small>Ranked by distinct supporting papers</small></div>${items.map((x,i)=>`<article class="result"><span class="rank">${String(i+1).padStart(2,'0')}</span><div>${next?`<button data-pick="${next}" data-code="${x.code}">${x.code} ${esc(x.label)}</button>`:`<strong>${x.code} ${esc(x.label)}</strong>`}</div><span class="count">${x.papers} papers · ${x.rows.length} records</span><details><summary>View paper evidence</summary><div class="excerpt">${x.rows.length?examples(x.rows):'No admitted record for this option.'}</div></details></article>`).join('')}</section>`}
    function sidebar(){const labels=['Evaluation dimensions','Subjective indicators','Tools'],hints=['Evaluation object','Dimension and design context','Dimension, indicator and purpose'];document.querySelector('#sidebar').innerHTML=`<h2>Evaluation pathway</h2><ol class="step-nav">${labels.map((x,i)=>`<li><button data-step="${i+1}" class="${state.stage===i+1?'active':''}" ${i===1&&!state.dimension||i===2&&!state.indicator?'disabled':''}><strong><i class="dot"></i>${x}</strong><span>${hints[i]}</span></button></li>`).join('')}</ol><div class="sidebar-section"><h2>Review corpus</h2><div class="stats"><div><b>125</b><span>Papers</span></div><div><b>212</b><span>Evaluation cases</span></div><div><b>904</b><span>Candidate records</span></div><div><b>834</b><span>Admitted records</span></div></div></div>`;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.stage=+b.dataset.step;render()})}
    function recommender(){
      sidebar();
      const steps=['Evaluation dimensions','Subjective indicators','Tools'];
      const intro=['What are you evaluating directly?','Which attribute do you want to assess?','How have studies measured it?'];
      const descriptions=['Choose an evaluation object to see dimensions used in related studies.','Define your design context, then choose an indicator within the selected dimension.','Choose an evaluation purpose to see tools used with the selected dimension and indicator.'];
      let body='';
      if(state.stage===1){
        let rows=D.chains.filter(r=>E.L1[r.L1_dimension]);
        if(state.object)rows=rows.filter(r=>match(r,'G4',state.object));
        body=`<div class="field-grid"><div class="field"><label for="object">Evaluation object</label><select id="object">${option('G4',state.object,'Select evaluation object')}</select><p class="context-help">The object determines which evaluation dimensions to show first.</p></div></div>${state.object?resultList(counts(rows,'L1',r=>r.L1_dimension),'L1','dimension'):''}`;
      }else if(state.stage===2){
        const context=[['G2','Design domain'],['G3','Design stage'],['G5','Evaluators'],['G7','AI function']];
        const rows=D.chains.filter(r=>r.L1_dimension===state.dimension&&context.every(([g])=>match(r,g,state.filters[g])));
        body=`<div class="selected"><span>${state.dimension} ${esc(name('L1',state.dimension))}</span></div><div class="field-grid">${context.map(([g,label])=>`<div class="field"><label for="context-${g}">${label}</label><select id="context-${g}" data-filter="${g}">${option(g,state.filters[g]||'',`Select ${label.toLowerCase()}`)}</select></div>`).join('')}</div>${context.every(([g])=>state.filters[g])?resultList(counts(rows,'L2',r=>r.L2_indicator).filter(x=>x.code.startsWith(state.dimension)),'L2','indicator'):'<div class="empty">Select all four context labels to see indicators.</div>'}`;
      }else{
        const rows=D.chains.filter(r=>r.L1_dimension===state.dimension&&r.L2_indicator===state.indicator);
        const filtered=rows.filter(r=>match(r,'G1',state.filters.G1));
        body=`<div class="selected"><span>${state.dimension} ${esc(name('L1',state.dimension))}</span><span>${state.indicator} ${esc(name('L2',state.indicator))}</span></div><div class="field-grid"><div class="field"><label for="purpose">Evaluation purpose</label><select id="purpose" data-filter="G1">${option('G1',state.filters.G1||'','Select evaluation purpose')}</select></div></div>${!state.filters.G1?'<div class="empty">Select an evaluation purpose to see tools.</div>':filtered.length?resultList(counts(filtered,'L3',r=>r.tool_code),'L3',''):`<div class="empty">No admitted paper matches this dimension, indicator and purpose. Change one of these choices to see other precedents.</div>`}`;
      }
      document.querySelector('#app').innerHTML=`<div class="hero"><h1>Plan a context-sensitive subjective evaluation</h1><p>Move from evaluation dimensions to subjective indicators and tools. Confirm each layer before the next set of inputs appears.</p></div><div class="panel"><h2>${state.stage}. ${steps[state.stage-1]}</h2><p class="lead">${intro[state.stage-1]} ${descriptions[state.stage-1]}</p>${body}</div><footer class="footer">Based on 125 papers and 834 admitted records · Research prototype · Data version 2026-11-13</footer>`;
      document.querySelector('#object')?.addEventListener('change',e=>{state.object=e.target.value;state.dimension='';state.indicator='';state.stage=1;render()});
      document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(b.dataset.pick==='dimension'){state.dimension=b.dataset.code;state.indicator='';state.stage=2}else{state.indicator=b.dataset.code;state.stage=3}render();window.scrollTo({top:0,behavior:'smooth'})});
      document.querySelectorAll('[data-filter]').forEach(s=>s.onchange=()=>{state.filters[s.dataset.filter]=s.value;if(state.stage===2)state.indicator='';render()});
    }
    function barGroup(rows,group,fn){const items=counts(rows,group,fn),max=Math.max(1,...items.map(x=>x.rows.length));return `<div><h3>${group==='G2'?'Design domains':'Evaluation dimensions'}</h3>${items.map(x=>`<div class="bar-row"><span>${x.code} ${esc(x.label)}</span><span class="bar"><i style="width:${100*x.rows.length/max}%"></i></span><strong>${x.rows.length}</strong></div>`).join('')}</div>`}
    function corpus(){
      const c=state.corpus;
      const rows=D.candidate_chains.filter(r=>
        (!c.query||[r.title,r.paper_id,r.chain_id,r.L1_dimension,r.L2_indicator].join(' ').toLowerCase().includes(c.query.toLowerCase()))&&
        match(r,'G2',c.domain)&&match(r,'G3',c.stage)&&
        (!c.dimension||r.L1_dimension===c.dimension)&&
        (!c.tool||parts(r.tool_code).includes(c.tool))&&
        (!c.status||(c.status==='admitted')===r.eligible_RQ3));
      const filters=`<div class="filters">
        <label>Search paper, record or code<input id="query" type="search" value="${esc(c.query)}" placeholder="Title, paper ID, A1..."></label>
        <label>Design domain<select data-corpus="domain">${option('G2',c.domain,'All domains')}</select></label>
        <label>Design stage<select data-corpus="stage">${option('G3',c.stage,'All stages')}</select></label>
        <label>Evaluation dimension<select data-corpus="dimension">${option('L1',c.dimension,'All dimensions')}</select></label>
        <label>Tool class<select data-corpus="tool">${option('L3',c.tool,'All tools')}</select></label>
        <label>Review status<select data-corpus="status"><option value="">All candidates</option><option value="admitted" ${c.status==='admitted'?'selected':''}>Admitted</option><option value="excluded" ${c.status==='excluded'?'selected':''}>Excluded by current review rule</option></select></label>
      </div>`;
      const table=`<div class="table-wrap"><table><thead><tr><th>Study</th><th>Context</th><th>Dimension</th><th>Indicator</th><th>Tool</th><th>Review status</th></tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr>
        <td>${esc(r.title)}<small>Paper ${esc(r.paper_id)} · ${esc(r.year)} · ${esc(r.chain_id)}</small></td>
        <td>${parts(r.G2_domain).map(x=>esc(name('G2',x))).join('; ')}<small>${parts(r.G3_stage).map(x=>esc(name('G3',x))).join('; ')}</small></td>
        <td>${esc(r.L1_dimension&&E.L1[r.L1_dimension]?`${r.L1_dimension} ${E.L1[r.L1_dimension]}`:'Not mapped')}</td>
        <td>${esc(r.L2_indicator&&E.L2[r.L2_indicator]?`${r.L2_indicator} ${E.L2[r.L2_indicator]}`:'Not mapped')}</td>
        <td>${esc(parts(r.tool_code).map(x=>`${x} ${name('L3',x)}`).join('; ')||'Not mapped')}</td>
        <td>${r.eligible_RQ3?'Admitted':'Excluded'}<small>${r.eligible_RQ3?'No Inadequate status':'Inadequate: '+esc(r.exclude_standards)}</small></td>
      </tr>`).join('')}</tbody></table></div>`;
      document.querySelector('#app').innerHTML=`<div class="corpus-main"><h1>Corpus and evidence map</h1><p>Inspect candidate records and their study-defined review status. Counts refer to records unless labelled otherwise.</p>
        <div class="summary-grid"><div><b>${D.corpus_papers}</b><span>Full-text papers</span></div><div><b>${D.evaluation_cases}</b><span>Evaluation cases</span></div><div><b>${D.candidate_records}</b><span>Candidate records</span></div><div><b>${D.eligible_records}</b><span>Admitted records</span></div></div>
        ${filters}<div class="profile">${barGroup(rows,'G2',r=>r.G2_domain)}${barGroup(rows,'L1',r=>r.L1_dimension)}</div>
        <h2>Evidence records</h2><p class="lead">Showing ${Math.min(100,rows.length)} of ${rows.length} matching candidate records.</p>${table}</div>
        <footer class="footer">Only admitted records enter the guide.</footer>`;
      document.querySelector('#query').oninput=e=>{state.corpus.query=e.target.value;corpus();document.querySelector('#query').focus()};
      document.querySelectorAll('[data-corpus]').forEach(s=>s.onchange=()=>{state.corpus[s.dataset.corpus]=s.value;corpus()})
    }
    function method(){document.querySelector('#app').innerHTML=`<div class="method-main"><h1>How the guide is produced</h1><p>Evaluation choices are organized as a sequence. The site shows what reviewed papers reported and leaves the final choice to the designer.</p><section><h2>Evaluation pathway</h2><div class="chain"><span>Evaluation question</span><b>→</b><span>Evaluation dimension</span><b>→</b><span>Subjective indicator</span><b>→</b><span>Tool</span></div><p>The question defines the perceived effect of interest. Each later choice makes that question more measurable.</p></section><section><h2>What the relation analysis found</h2><table><thead><tr><th>Layer</th><th>Complete records</th><th>Predictive result</th><th>Guide behavior</th></tr></thead><tbody><tr><td>Dimension</td><td>388 · 59 papers</td><td>G4 evaluation object contributed most among G1–G7 in the sample.</td><td>Ask about the object first.</td></tr><tr><td>Indicator</td><td>388 · 59 papers</td><td>The known dimension and G2 design domain, G3 design stage, G5 evaluators and G7 AI function inform this layer.</td><td>Ask about these four context labels after the dimension is chosen; keep all preset indicators visible.</td></tr><tr><td>Tool</td><td>388 · 59 papers</td><td>The known dimension and indicator precede tool choice; G1 evaluation purpose had the largest G-group contribution.</td><td>Ask for purpose after the indicator is chosen and show paper-level tool precedents.</td></tr></tbody></table></section><section><h2>Model checks</h2><p>Four method families were preset: smoothed context frequency, regularized multinomial logistic regression, Extra Trees and CatBoost. The current analysis fitted fixed configurations to the same 388 records and scored them in sample. Paper-weighted multiclass log loss was the main score, with Top-1 as a secondary description.</p><p>Group contributions use refit-based Shapley across input subsets and are checked against in-sample group ablations. The current selections are an exploratory guide policy based on these descriptive results; they are not causal weights or validated probabilities of suitability.</p></section></div><footer class="footer">Research prototype · Analysis version 2026-11-14</footer>`}
    function render(){const page=route();document.body.dataset.page=page;document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===page));if(page==='recommender')recommender();else{document.querySelector('#sidebar').innerHTML='';page==='corpus'?corpus():method()}}
    window.addEventListener('hashchange',render);render();
  </script>
</body>
</html>
